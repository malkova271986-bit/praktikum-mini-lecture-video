<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;font-family:'Inter';color:#f5f3ff;
background:radial-gradient(700px 600px at 80% 60%,#3b2a8f 0%,rgba(59,42,143,0) 65%),radial-gradient(600px 500px at 5% 100%,#0e5566 0%,rgba(14,85,102,0) 60%),linear-gradient(160deg,#140e38,#0b0820);position:relative}
.dots{position:absolute;inset:0;opacity:.35;background-image:radial-gradient(circle,rgba(167,139,250,.4) 1.5px,transparent 1.7px);background-size:30px 30px}
.chip{position:absolute;left:64px;top:70px;font-family:'DejaVu Sans Mono';font-size:24px;letter-spacing:3px;color:#5eead4;padding:10px 18px;border:2px solid rgba(94,234,212,.6);border-radius:10px;background:rgba(94,234,212,.08)}
.chip i{display:inline-block;width:11px;height:11px;background:#4ade80;border-radius:2px;margin-right:10px;box-shadow:0 0 10px #4ade80}
h1{position:absolute;left:60px;top:150px;font-family:'Inter Display';font-weight:900;font-size:104px;line-height:.98;letter-spacing:-2px;text-shadow:0 6px 30px rgba(0,0,0,.5)}
h1 em{font-style:normal;background:linear-gradient(90deg,#c4b5fd,#67e8f9);-webkit-background-clip:text;color:transparent}
.time{position:absolute;left:64px;bottom:70px;font-family:'Inter Display';font-weight:800;font-size:34px;padding:12px 24px;border-radius:14px;background:#f472b6;color:#1b1446}
img.h{position:absolute;right:30px;bottom:-60px;height:760px}
img.r{position:absolute;left:640px;top:470px;height:130px;transform:rotate(-8deg)}
</style></head><body><div class="dots"></div>
<div class="chip"><i></i>МИНИ-ЛЕКЦИЯ</div>
<h1 style="font-size:96px">Дизайн <em>ЭОР</em><span style="display:block;margin-top:14px;font-size:54px;line-height:1.08;letter-spacing:-1px">от педагогики<br>до игровых механик</span></h1>
<div class="time">финал серии</div>
<img class="h" src="../assets/hero/front_0.png"><img class="r" src="../assets/hero/front_2.png">
</body></html>
